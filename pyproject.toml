[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keycall"
version = "0.1.0"
description = "One consistent interface for validating AI-provider API keys, listing and filtering their models, and making normalized calls."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
authors = [{ name = "Mo Shehu" }]
keywords = ["llm", "api-keys", "openai", "anthropic", "gemini", "model-picker"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "tomli>=2.0; python_version < '3.11'",
    "typing_extensions>=4.0; python_version < '3.11'",
]

[project.optional-dependencies]
traceact = ["traceact>=0.13"]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5", "traceact>=0.13"]

[project.urls]
Homepage = "https://github.com/shehuphd/keycall"

[project.scripts]
keycall = "keycall._cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/keycall"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
strict = true
python_version = "3.10"
