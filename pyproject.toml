[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keycall"
version = "1.8.0"
description = "One consistent interface for validating AI-provider API keys, listing and filtering their models, and making normalized calls."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
authors = [{ name = "Mo Shehu" }]
keywords = [
    "llm",
    "api-keys",
    "api-key-validation",
    "model-picker",
    "openai",
    "anthropic",
    "gemini",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Environment :: Console",
]
dependencies = [
    "httpx>=0.27",
    "httpx-ws>=0.7",
    "tomli>=2.0; python_version < '3.11'",
    "typing_extensions>=4.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Upper-bounded to match _tracing.py's own _COMPATIBLE_MAX_EXCLUSIVE: an
# unbounded constraint here would let pip install a traceact release the
# runtime guard immediately disables, which is what happened when 1.0.0
# shipped upstream and CI's fresh install picked it straight up before the
# guard's own ceiling was raised to match. traceact's 1.0.0 release notes
# declare its public API stable, breaking changes only on a major bump, so
# the ceiling now sits at the next major rather than at 1.0 itself.
traceact = ["traceact>=0.13,<2.0"]
# tomli is unconditional here, unlike in the runtime dependencies where it
# is gated to Python < 3.11: mypy targets 3.10, so it type-checks the
# backport branch of the TOML import regardless of the interpreter running
# it, and cannot resolve a module that was never installed.
# traceact is floored at 0.14.2 here, above the runtime floor: that release
# added the py.typed marker, without which mypy skips traceact entirely and
# the gated type check fails on an import it cannot read. Runtime is
# unaffected, so the optional extra above stays where it is. Same upper
# bound as the traceact extra, for the same reason.
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5", "traceact>=0.14.2,<2.0", "tomli>=2.0"]

[project.urls]
Homepage = "https://github.com/shehuphd/keycall"
Documentation = "https://github.com/shehuphd/keycall/blob/main/USAGE.md"
Changelog = "https://github.com/shehuphd/keycall/blob/main/CHANGELOG.md"
Issues = "https://github.com/shehuphd/keycall/issues"
Source = "https://github.com/shehuphd/keycall"

[project.scripts]
keycall = "keycall._cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/keycall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests are deselected by default; a later command-line -m
# overrides this, so `pytest -m live` selects them.
addopts = "-m 'not live'"
markers = [
    "live: makes real provider API calls; needs KEYCALL_LIVE_SOURCE pointing at a target file",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
strict = true
python_version = "3.10"

