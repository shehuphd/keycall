[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keycall"
version = "0.7.0"
description = "One consistent interface for validating AI-provider API keys, listing and filtering their models, and making normalized calls."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
authors = [{ name = "Mo Shehu" }]
keywords = [
    "llm",
    "api-keys",
    "api-key-validation",
    "model-picker",
    "openai",
    "anthropic",
    "gemini",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Environment :: Console",
]
dependencies = [
    "httpx>=0.27",
    "tomli>=2.0; python_version < '3.11'",
    "typing_extensions>=4.0; python_version < '3.11'",
]

[project.optional-dependencies]
traceact = ["traceact>=0.13"]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5", "traceact>=0.13"]

[project.urls]
Homepage = "https://github.com/shehuphd/keycall"
Documentation = "https://github.com/shehuphd/keycall/blob/main/USAGE.md"
Changelog = "https://github.com/shehuphd/keycall/blob/main/CHANGELOG.md"
Issues = "https://github.com/shehuphd/keycall/issues"
Source = "https://github.com/shehuphd/keycall"

[project.scripts]
keycall = "keycall._cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/keycall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests are deselected by default; a later command-line -m
# overrides this, so `pytest -m live` selects them.
addopts = "-m 'not live'"
markers = [
    "live: makes real provider API calls; needs KEYCALL_LIVE_SOURCE pointing at a target file",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
strict = true
python_version = "3.10"
