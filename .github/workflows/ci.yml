name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Type check
        # The package ships py.typed, so its annotations are a promise to
        # callers' type checkers. Left ungated, the error count drifted to
        # 27 unnoticed across several releases.
        run: mypy src

      - name: Test
        # No provider secrets: the suite runs against recorded fixtures
        # only; live tests are deselected by the default -m filter.
        run: pytest -q

      # Pinned rather than taking the image's default, so a runner image
      # bump can't change the runtime under the tests. There is no
      # package.json and no npm dependency: the runner is Node's own.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Test the viewer's renderer
        # The viewer renders untrusted model output into a page holding a
        # live credential token, so the no-HTML-parsing guarantee needs a
        # regression test rather than a one-off manual check.
        #
        # The shell expands the glob, not node: `node --test` only learned
        # to take glob patterns itself in Node 21, and this way the command
        # works the same on any version that has the test runner at all.
        run: node --test tests/js/*.test.mjs

  # Live-verification mode "warn": live smoke on manual dispatch only,
  # never on routine pushes or fork PRs. Failures are reported but do not
  # fail CI.
  live-warn:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      KEYCALL_LIVE_TARGETS: ${{ secrets.KEYCALL_LIVE_TARGETS }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Note when credentials are absent
        if: env.KEYCALL_LIVE_TARGETS == ''
        run: echo "::notice::live smoke skipped — KEYCALL_LIVE_TARGETS secret is not set"

      - name: Live smoke (warn)
        if: env.KEYCALL_LIVE_TARGETS != ''
        run: |
          pip install -e ".[dev]"
          printf '%s' "$KEYCALL_LIVE_TARGETS" > "$RUNNER_TEMP/live-targets.toml"
          KEYCALL_LIVE_SOURCE="$RUNNER_TEMP/live-targets.toml" pytest -q -m live -s

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build
        run: |
          pip install build twine
          python -m build

      - name: Check metadata
        run: twine check dist/*

      - name: Verify package data ships
        # catalog.json and py.typed are easy to lose to a packaging change
        # and only fail at runtime, so assert them here.
        run: |
          python - <<'EOF'
          import glob, zipfile, sys
          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(wheel).namelist()
          missing = [
              f for f in (
                  "keycall/_catalog/catalog.json",
                  "keycall/py.typed",
                  "keycall/viewer/static/index.html",
                  "keycall/viewer/static/app.js",
                  "keycall/viewer/static/styles.css",
              )
              if f not in names
          ]
          if missing:
              sys.exit(f"missing from wheel: {missing}")
          print(f"{wheel}: package data present")
          EOF

      - name: Install from wheel and smoke test
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python -c "
          import keycall
          from keycall._registry import resolve_provider, catalog_version
          assert resolve_provider('anthropic').base_url.startswith('https://')
          print('keycall', keycall.__version__, 'catalog', catalog_version())
          "
