name: Release

# Publishing is tag-driven: push a v* tag, and this builds, verifies,
# publishes to PyPI, and cuts the GitHub release. Nothing publishes from a
# developer machine.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      test_pypi:
        description: "Publish to TestPyPI instead of PyPI"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install tooling
        run: pip install build twine

      - name: Verify tag matches package version
        # A tag that disagrees with pyproject would publish the wrong version
        # under the right name, which cannot be undone on PyPI.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'EOF'
          import os, sys, tomllib
          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if tag != version:
              sys.exit(f"tag {tag!r} != pyproject version {version!r}")
          print(f"version {version} matches tag")
          EOF

      - name: Run tests
        run: |
          pip install -e ".[dev]"
          ruff check src tests
          mypy src
          pytest -q

      - name: Build
        run: python -m build

      - name: Check metadata
        run: twine check dist/*

      - name: Verify package data ships
        run: |
          python - <<'EOF'
          import glob, zipfile, sys
          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(wheel).namelist()
          missing = [
              f for f in (
                  "keycall/_catalog/catalog.json",
                  "keycall/py.typed",
                  "keycall/viewer/static/index.html",
                  "keycall/viewer/static/app.js",
                  "keycall/viewer/static/styles.css",
              )
              if f not in names
          ]
          if missing:
              sys.exit(f"missing from wheel: {missing}")
          EOF

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.test_pypi
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write  # OIDC for trusted publishing; no API token stored
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # Live-verification mode "strict": a release publishes only after every
  # live target verifies. A missing KEYCALL_LIVE_TARGETS secret fails this
  # job deliberately — an unverified release is blocked, not silently
  # skipped.
  live-strict:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      KEYCALL_LIVE_TARGETS: ${{ secrets.KEYCALL_LIVE_TARGETS }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Require credentials
        if: env.KEYCALL_LIVE_TARGETS == ''
        run: |
          echo "::error::KEYCALL_LIVE_TARGETS secret is not set; a release cannot be live-verified (strict mode blocks it)"
          exit 1

      - name: Live smoke (strict)
        run: |
          pip install -e ".[dev]"
          printf '%s' "$KEYCALL_LIVE_TARGETS" > "$RUNNER_TEMP/live-targets.toml"
          KEYCALL_LIVE_SOURCE="$RUNNER_TEMP/live-targets.toml" pytest -q -m live -s

  publish-pypi:
    needs: [build, live-strict]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC for trusted publishing; no API token stored
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish-pypi
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to create the release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Extract release notes from CHANGELOG.md
        # Release notes are the tag's CHANGELOG.md section verbatim, not a
        # second hand-written copy. Keeps one source of truth.
        run: |
          python - <<'EOF'
          import os, re

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()

          pattern = rf"^## \[{re.escape(version)}\].*?\n(.*?)(?=\n## \[|\n\[[\w.]+\]: |\Z)"
          match = re.search(pattern, text, re.MULTILINE | re.DOTALL)
          if not match:
              raise SystemExit(f"no CHANGELOG.md section found for version {version}")

          body = match.group(1).strip()
          repo = os.environ["GITHUB_REPOSITORY"]
          body += f"\n\nFull usage docs: [USAGE.md](https://github.com/{repo}/blob/main/USAGE.md)"

          with open("release-notes.md", "w", encoding="utf-8") as f:
              f.write(body)
          EOF

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            dist/*
